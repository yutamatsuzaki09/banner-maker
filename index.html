<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liminoid Banner Studio v6 (Profile用)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* 本番サイトと同等のカードプレビュー用スタイル */
.achieve-card-preview {
  background: #141312;
  border: 1px solid #2a2825;
  border-radius: 16px;
  overflow: hidden;
  display: block;
}
.achieve-thumb-preview {
  position: relative;
  aspect-ratio: 16/9;
  overflow: hidden;
  background: #1b1a18;
}
.achieve-date-preview {
  position: absolute; top: 10px; left: 10px;
  background: rgba(10,10,10,0.85);
  border: 1px solid #c8102e;
  color: #c8102e;
  font-size: 11px;
  letter-spacing: 0.1em;
  padding: 2px 10px;
  border-radius: 9999px;
}
</style>
</head>
<body class="bg-neutral-900 text-neutral-100 min-h-screen flex flex-col items-center justify-center p-6 py-10">

<div class="max-w-2xl w-full bg-neutral-800 border border-neutral-700 rounded-2xl p-8 shadow-2xl">
  <h1 class="text-xl font-bold mb-1 text-center">Liminoid Banner Studio v6</h1>
  <p class="text-xs text-neutral-400 text-center mb-6">profile.html用 実績自動更新＆選択的公開ツール</p>

  <!-- GitHub設定 -->
  <details class="mb-6 bg-neutral-900/50 border border-neutral-700 rounded-xl p-4 text-xs">
    <summary class="cursor-pointer font-bold text-neutral-300 hover:text-white">⚙️ GitHub連携設定（初回のみ）</summary>
    <div class="mt-3 flex flex-col gap-3">
      <div>
        <label class="block text-neutral-400 mb-1">GitHub Personal Access Token:</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-white">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-neutral-400 mb-1">ユーザー名:</label>
          <input type="text" id="gh-user" value="yutamatsuzaki09" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-white">
        </div>
        <div>
          <label class="block text-neutral-400 mb-1">リポジトリ名:</label>
          <input type="text" id="gh-repo" value="liminoid" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-white">
        </div>
      </div>
      <button id="save-settings" class="bg-neutral-700 hover:bg-neutral-600 text-white font-bold py-1.5 rounded transition-colors">設定をブラウザに保存</button>
    </div>
  </details>

  <!-- ステップ1：画像ドロップ -->
  <div class="mb-6">
    <p class="text-sm font-bold mb-2">① 画像を準備する</p>
    <div id="drop-zone" class="border-2 border-dashed border-neutral-600 rounded-xl p-6 text-center cursor-pointer hover:border-red-500 transition-colors">
      <p class="text-sm text-neutral-300">ここに画像をドラッグ＆ドロップ</p>
      <input type="file" id="file-input" accept="image/*" class="hidden">
    </div>
  </div>

  <!-- エディタエリア -->
  <div id="editor-area" class="hidden flex-col gap-6">
    
    <!-- ステップ2：URL入力と自動抽出 -->
    <div class="bg-neutral-900/50 p-4 rounded-xl border border-neutral-700">
      <p class="text-sm font-bold mb-3">② リンク先URLとテキスト設定</p>
      <div class="flex gap-2 mb-4">
        <input type="url" id="target-url" placeholder="https://..." class="flex-1 bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
        <button id="fetch-btn" class="bg-neutral-700 hover:bg-neutral-600 px-4 py-2 rounded text-sm font-bold transition-colors whitespace-nowrap">自動抽出</button>
      </div>
      
      <div class="flex flex-col gap-3">
        <div class="flex gap-3">
          <div class="w-1/4">
            <label class="block text-xs text-neutral-400 mb-1">年月</label>
            <input type="text" id="card-date" placeholder="2026.08" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500 font-display">
          </div>
          <div class="w-3/4">
            <label class="block text-xs text-neutral-400 mb-1">タイトル</label>
            <input type="text" id="card-title" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
          </div>
        </div>
        <div>
          <label class="block text-xs text-neutral-400 mb-1">説明文</label>
          <textarea id="card-desc" rows="2" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500"></textarea>
        </div>
      </div>
    </div>

    <!-- プレビューとキャンバス調整 -->
    <div>
      <div class="flex items-center justify-between mb-2">
        <p class="text-sm font-bold">③ 画像調整・キャンバス</p>
        <div class="flex items-center gap-2 bg-neutral-900 border border-neutral-700 rounded-lg p-1 text-xs">
          <span class="text-neutral-400 pl-1">背景:</span>
          <button id="bg-transparent-btn" class="px-2 py-1 rounded font-bold bg-neutral-700 text-white">透過</button>
          <button id="bg-white-btn" class="px-2 py-1 rounded font-bold text-neutral-400 hover:text-white">白背景</button>
        </div>
      </div>
      <div class="w-full aspect-[16/9] bg-[radial-gradient(#333_1px,transparent_1px)] [background-size:16px_16px] border border-neutral-700 rounded-lg overflow-hidden flex items-center justify-center">
        <canvas id="canvas" class="max-w-full max-h-full object-contain"></canvas>
      </div>
    </div>

    <!-- ステップ4：完成時の実表示シミュレーションプレビュー -->
    <div class="bg-neutral-900/80 p-5 rounded-xl border border-red-900/50">
      <p class="text-xs font-bold text-red-400 uppercase tracking-widest mb-3">④ 実績カード完成プレビュー（公開前の最終確認）</p>
      
      <div class="achieve-card-preview p-0">
        <div class="achieve-thumb-preview">
          <span class="achieve-date-preview" id="preview-card-date">2026.08</span>
          <img id="preview-card-img" class="w-full h-full object-cover" src="" alt="preview">
        </div>
        <div class="p-4">
          <h3 class="text-white font-bold text-sm mb-1" id="preview-card-title">（タイトルがここに入ります）</h3>
          <p class="text-neutral-400 text-xs leading-relaxed" id="preview-card-desc">（説明文がここに入ります）</p>
        </div>
      </div>
    </div>

    <!-- 適用選択アクションボタン -->
    <div class="w-full flex flex-col sm:flex-row gap-3 mt-2">
      <button id="cancel-btn" class="sm:w-1/3 bg-neutral-700 hover:bg-neutral-600 text-neutral-200 font-bold py-3.5 rounded-xl transition-colors cursor-pointer text-sm">
        ↩️ キャンセル / やり直す
      </button>
      <button id="publish-btn" class="sm:w-2/3 bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl transition-colors cursor-pointer text-sm shadow-lg">
        🚀 この内容で profile.html に適用（公開）
      </button>
    </div>
    
    <p id="status-msg" class="text-sm font-bold text-center mt-2"></p>
  </div>
</div>

<script>
// UI要素
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const editorArea = document.getElementById('editor-area');
const targetUrlInput = document.getElementById('target-url');
const fetchBtn = document.getElementById('fetch-btn');
const cardDateInput = document.getElementById('card-date');
const cardTitleInput = document.getElementById('card-title');
const cardDescInput = document.getElementById('card-desc');
const publishBtn = document.getElementById('publish-btn');
const cancelBtn = document.getElementById('cancel-btn');
const statusMsg = document.getElementById('status-msg');

// 実績カードリアルタイムプレビュー用要素
const previewCardDate = document.getElementById('preview-card-date');
const previewCardImg = document.getElementById('preview-card-img');
const previewCardTitle = document.getElementById('preview-card-title');
const previewCardDesc = document.getElementById('preview-card-desc');

const bgTransparentBtn = document.getElementById('bg-transparent-btn');
const bgWhiteBtn = document.getElementById('bg-white-btn');

// 設定関連
const ghTokenInput = document.getElementById('gh-token');
const ghUserInput = document.getElementById('gh-user');
const ghRepoInput = document.getElementById('gh-repo');
const saveSettingsBtn = document.getElementById('save-settings');

let loadedImage = null;
let currentFileName = "";
let isWhiteBg = false;

function setTodayDate() {
  const now = new Date();
  cardDateInput.value = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}`;
  updateCardPreview();
}

ghTokenInput.value = localStorage.getItem('gh_token') || '';
ghUserInput.value = localStorage.getItem('gh_user') || 'yutamatsuzaki09';
ghRepoInput.value = localStorage.getItem('gh_repo') || 'liminoid';

saveSettingsBtn.addEventListener('click', () => {
  localStorage.setItem('gh_token', ghTokenInput.value.trim());
  localStorage.setItem('gh_user', ghUserInput.value.trim());
  localStorage.setItem('gh_repo', ghRepoInput.value.trim());
  alert('設定を保存しました！');
});

canvas.width = 1920;
canvas.height = 1080;

// カード完成プレビューのリアルタイム更新
function updateCardPreview() {
  previewCardDate.textContent = cardDateInput.value || "2026.08";
  previewCardTitle.textContent = cardTitleInput.value || "（タイトルがここに入ります）";
  previewCardDesc.textContent = cardDescInput.value || "（説明文がここに入ります）";
  if (canvas) {
    previewCardImg.src = canvas.toDataURL('image/png');
  }
}

// 入力イベントリスナーの追加
[cardDateInput, cardTitleInput, cardDescInput].forEach(input => {
  input.addEventListener('input', updateCardPreview);
});

window.addEventListener('load', () => {
  setTodayDate();
  
  const params = new URLSearchParams(window.location.search);
  const urlParam = params.get('url');
  const titleParam = params.get('title');
  const descParam = params.get('desc');

  if (urlParam || titleParam || descParam) {
    if (urlParam) targetUrlInput.value = urlParam;
    if (titleParam) cardTitleInput.value = titleParam;
    if (descParam) cardDescInput.value = descParam;

    editorArea.classList.remove('hidden');
    editorArea.classList.add('flex');
    updateCardPreview();
  }
});

function renderCanvas() {
  if (!loadedImage) return;
  ctx.clearRect(0, 0, 1920, 1080);

  if (isWhiteBg) {
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, 1920, 1080);
  }

  const maxW = 1920 * 0.8;
  const maxH = 1080 * 0.8;
  const ratio = Math.min(maxW / loadedImage.width, maxH / loadedImage.height);
  const newW = loadedImage.width * ratio;
  const newH = loadedImage.height * ratio;
  const posX = (1920 - newW) / 2;
  const posY = (1080 - newH) / 2;

  ctx.drawImage(loadedImage, posX, posY, newW, newH);
  updateCardPreview();
}

bgTransparentBtn.addEventListener('click', () => {
  isWhiteBg = false;
  bgTransparentBtn.className = "px-2 py-1 rounded font-bold bg-neutral-700 text-white";
  bgWhiteBtn.className = "px-2 py-1 rounded font-bold text-neutral-400 hover:text-white";
  renderCanvas();
});

bgWhiteBtn.addEventListener('click', () => {
  isWhiteBg = true;
  bgWhiteBtn.className = "px-2 py-1 rounded font-bold bg-white text-black";
  bgTransparentBtn.className = "px-2 py-1 rounded font-bold text-neutral-400 hover:text-white";
  renderCanvas();
});

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-red-500'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-red-500'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('border-red-500');
  if (e.dataTransfer.files.length) processImage(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) processImage(e.target.files[0]);
});

function processImage(file) {
  currentFileName = `banner_${file.name.replace(/\.[^/.]+$/, "")}.png`;
  statusMsg.textContent = "";
  
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      renderCanvas();
      editorArea.classList.remove('hidden');
      editorArea.classList.add('flex');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

fetchBtn.addEventListener('click', async () => {
  const url = targetUrlInput.value.trim();
  if (!url) return alert('URLを入力してください');
  
  fetchBtn.textContent = "取得中...";
  fetchBtn.disabled = true;

  let htmlContent = "";

  try {
    const proxyUrl1 = "https://api.allorigins.win/get?url=" + encodeURIComponent(url);
    const res = await fetch(proxyUrl1);
    if (res.ok) {
      const data = await res.json();
      htmlContent = data.contents;
    }
  } catch(e) {}

  if (!htmlContent) {
    try {
      const proxyUrl2 = "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url);
      const res = await fetch(proxyUrl2);
      if (res.ok) htmlContent = await res.text();
    } catch(e) {}
  }

  if (!htmlContent) {
    alert('自動抽出できませんでした。手動で入力してください。');
    fetchBtn.textContent = "自動抽出";
    fetchBtn.disabled = false;
    return;
  }

  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlContent, "text/html");
    
    let title = doc.querySelector('meta[property="og:title"]')?.content || doc.title || "";
    let desc = doc.querySelector('meta[property="og:description"]')?.content || doc.querySelector('meta[name="description"]')?.content || "";

    cardTitleInput.value = title;
    cardDescInput.value = desc;
    updateCardPreview();
  } catch (err) {
    alert('エラーが発生しました。手動で入力してください。');
  } finally {
    fetchBtn.textContent = "自動抽出";
    fetchBtn.disabled = false;
  }
});

// キャンセル処理
cancelBtn.addEventListener('click', () => {
  if (confirm('入力内容を破棄して編集を完了しますか？')) {
    editorArea.classList.add('hidden');
    editorArea.classList.remove('flex');
    loadedImage = null;
    fileInput.value = "";
    statusMsg.textContent = "";
  }
});

function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

// 🚀 GitHubへダイレクト公開処理 (選択・確認ステップ付き)
publishBtn.addEventListener('click', async () => {
  const token = localStorage.getItem('gh_token');
  const user = localStorage.getItem('gh_user') || 'yutamatsuzaki09';
  const repo = localStorage.getItem('gh_repo') || 'liminoid';

  if (!token) return alert('設定にトークンを入力してください。');
  if (!targetUrlInput.value) return alert('URLを入力してください。');
  if (!cardTitleInput.value) return alert('タイトルを入力してください。');
  if (!cardDateInput.value) return alert('年月を入力してください。');

  // ★ 最終確認ダイアログ
  const confirmMsg = `以下の実績を profile.html に公開します。よろしいですか？\n\n【年月】${cardDateInput.value}\n【タイトル】${cardTitleInput.value}`;
  if (!confirm(confirmMsg)) return;

  publishBtn.disabled = true;
  publishBtn.classList.add('opacity-50');
  
  try {
    statusMsg.className = "text-sm font-bold text-center text-yellow-400";
    statusMsg.textContent = "🔄 1/2: 画像をアップロード中...";
    
    const base64Img = canvas.toDataURL('image/png').replace(/^data:image\/png;base64,/, "");
    const imgUrl = `https://api.github.com/repos/${user}/${repo}/contents/${currentFileName}`;
    
    let imgSha = null;
    const imgGetRes = await fetch(imgUrl, { headers: { "Authorization": `token ${token}` } });
    if (imgGetRes.ok) imgSha = (await imgGetRes.json()).sha;

    const imgPutRes = await fetch(imgUrl, {
      method: "PUT",
      headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({ message: `Add banner: ${currentFileName}`, content: base64Img, sha: imgSha || undefined })
    });
    if (!imgPutRes.ok) throw new Error("画像のアップロードに失敗しました");

    statusMsg.textContent = "🔄 2/2: profile.html を最新順に自動ソート更新中...";
    const htmlUrl = `https://api.github.com/repos/${user}/${repo}/contents/profile.html`;
    
    const htmlGetRes = await fetch(htmlUrl, { headers: { "Authorization": `token ${token}` } });
    if (!htmlGetRes.ok) throw new Error("profile.htmlの取得に失敗しました");
    
    const htmlData = await htmlGetRes.json();
    const currentHtml = b64_to_utf8(htmlData.content);
    const htmlSha = htmlData.sha;

    const newCardHtml = `
<a href="${targetUrlInput.value}" target="_blank" rel="noopener" class="achieve-card">
<div class="achieve-thumb">
<span class="achieve-date">${cardDateInput.value}</span>
<img src="${currentFileName}" alt="${cardTitleInput.value}" loading="lazy" decoding="async" onerror="this.style.display='none'">
<span class="achieve-play"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
</div>
<div class="p-5">
<h3 class="font-display text-base tracking-wide-jp mb-1.5">${cardTitleInput.value}</h3>
<p class="text-sm text-[var(--ink-dim)] leading-relaxed">${cardDescInput.value}</p>
</div>
</a>`;

    const listRegex = /(<section id="achievements"[\s\S]*?<div class="grid sm:grid-cols-2 gap-6">)([\s\S]*?)(<\/div>\s*<\/section>)/;
    const match = currentHtml.match(listRegex);
    if (!match) throw new Error("profile.html内に置換用の目印（#achievements）が見つかりません。");

    const prefix = match[1];
    const existingCardsHtml = match[2];
    const suffix = match[3];

    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = existingCardsHtml + "\n" + newCardHtml;

    const cards = Array.from(tempDiv.querySelectorAll('.achieve-card'));
    cards.sort((a, b) => {
      let dateA = a.querySelector('.achieve-date')?.textContent.trim() || "0000";
      let dateB = b.querySelector('.achieve-date')?.textContent.trim() || "0000";
      
      dateA = dateA.includes('.') ? dateA : dateA + ".00";
      dateB = dateB.includes('.') ? dateB : dateB + ".00";
      
      return dateB.localeCompare(dateA); 
    });

    tempDiv.innerHTML = '';
    cards.forEach(card => {
      tempDiv.appendChild(card);
      tempDiv.appendChild(document.createTextNode("\n\n"));
    });

    const updatedHtml = currentHtml.replace(listRegex, prefix + "\n\n" + tempDiv.innerHTML + suffix);

    const htmlPutRes = await fetch(htmlUrl, {
      method: "PUT",
      headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `Add new achievement to profile.html: ${cardTitleInput.value}`,
        content: utf8_to_b64(updatedHtml),
        sha: htmlSha
      })
    });
    
    if (!htmlPutRes.ok) throw new Error("profile.htmlの保存に失敗しました");

    statusMsg.className = "text-sm font-bold text-center text-green-400";
    statusMsg.textContent = `✅ 公開完了！profile.html が正常に更新されました。`;
    
  } catch (err) {
    statusMsg.className = "text-sm font-bold text-center text-red-400";
    statusMsg.textContent = `❌ エラー: ${err.message}`;
  } finally {
    publishBtn.disabled = false;
    publishBtn.classList.remove('opacity-50');
  }
});
</script>
</body>
</html>

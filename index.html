<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liminoid Banner Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-900 text-neutral-100 min-h-screen flex flex-col items-center justify-center p-6">

<div class="max-w-xl w-full bg-neutral-800 border border-neutral-700 rounded-2xl p-8 shadow-2xl">
  <h1 class="text-xl font-bold mb-1 text-center">16:9 透過バナー自動公開スタジオ</h1>
  <p class="text-xs text-neutral-400 text-center mb-6">画像生成からLiminoidサイトへの本番反映までを完結します</p>

  <!-- GitHub設定（初回のみ） -->
  <details class="mb-6 bg-neutral-900/50 border border-neutral-700 rounded-xl p-4 text-xs">
    <summary class="cursor-pointer font-bold text-neutral-300 hover:text-white">⚙️ GitHub連携設定（最初に1回だけ入力）</summary>
    <div class="mt-3 flex flex-col gap-3">
      <div>
        <label class="block text-neutral-400 mb-1">GitHub Personal Access Token:</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-white focus:outline-none focus:border-red-500">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-neutral-400 mb-1">ユーザー名:</label>
          <input type="text" id="gh-user" value="matsuzakiyuta" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-white">
        </div>
        <div>
          <label class="block text-neutral-400 mb-1">リポジトリ名:</label>
          <input type="text" id="gh-repo" value="Liminoid" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-white">
        </div>
      </div>
      <button id="save-settings" class="bg-neutral-700 hover:bg-neutral-600 text-white font-bold py-1.5 rounded transition-colors">設定をブラウザに保存</button>
    </div>
  </details>

  <!-- ファイルドロップエリア -->
  <div id="drop-zone" class="border-2 border-dashed border-neutral-600 rounded-xl p-8 text-center cursor-pointer hover:border-red-500 transition-colors mb-6">
    <p class="text-sm text-neutral-300">ここに画像をドラッグ＆ドロップ<br><span class="text-xs text-neutral-500">またはクリックして選択</span></p>
    <input type="file" id="file-input" accept="image/*" class="hidden">
  </div>

  <!-- プレビューと操作エリア -->
  <div id="result-area" class="hidden flex-col items-center gap-4">
    <div class="w-full aspect-[16/9] bg-[radial-gradient(#333_1px,transparent_1px)] [background-size:16px_16px] border border-neutral-700 rounded-lg overflow-hidden flex items-center justify-center">
      <canvas id="canvas" class="max-w-full max-h-full object-contain"></canvas>
    </div>

    <!-- アクションボタン -->
    <div class="w-full flex flex-col gap-2">
      <button id="publish-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition-colors cursor-pointer text-sm flex items-center justify-center gap-2">
        🚀 Liminoid サイトに直接公開（GitHubへ送信）
      </button>
      <a id="download-btn" class="w-full text-center bg-neutral-700 hover:bg-neutral-600 text-neutral-300 py-2 rounded-xl transition-colors cursor-pointer text-xs">
        PCに画像だけダウンロード（バックアップ用）
      </a>
    </div>
    
    <!-- ステータス表示 -->
    <p id="status-msg" class="text-xs font-bold text-center mt-1"></p>
  </div>
</div>

<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const resultArea = document.getElementById('result-area');
const publishBtn = document.getElementById('publish-btn');
const downloadBtn = document.getElementById('download-btn');
const statusMsg = document.getElementById('status-msg');

const ghTokenInput = document.getElementById('gh-token');
const ghUserInput = document.getElementById('gh-user');
const ghRepoInput = document.getElementById('gh-repo');
const saveSettingsBtn = document.getElementById('save-settings');

let currentFileName = "";

// 設定の読み込み
ghTokenInput.value = localStorage.getItem('gh_token') || '';
ghUserInput.value = localStorage.getItem('gh_user') || 'matsuzakiyuta';
ghRepoInput.value = localStorage.getItem('gh_repo') || 'Liminoid';

saveSettingsBtn.addEventListener('click', () => {
  localStorage.setItem('gh_token', ghTokenInput.value.trim());
  localStorage.setItem('gh_user', ghUserInput.value.trim());
  localStorage.setItem('gh_repo', ghRepoInput.value.trim());
  alert('設定を保存しました！');
});

canvas.width = 1920;
canvas.height = 1080;

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-red-500'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-red-500'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('border-red-500');
  if (e.dataTransfer.files.length) processImage(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) processImage(e.target.files[0]);
});

function processImage(file) {
  currentFileName = `banner_${file.name.replace(/\.[^/.]+$/, "")}.png`;
  statusMsg.textContent = "";
  
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, 1920, 1080);
      const maxW = 1920 * 0.8;
      const maxH = 1080 * 0.8;
      const ratio = Math.min(maxW / img.width, maxH / img.height);
      const newW = img.width * ratio;
      const newH = img.height * ratio;
      const posX = (1920 - newW) / 2;
      const posY = (1080 - newH) / 2;

      ctx.drawImage(img, posX, posY, newW, newH);

      downloadBtn.href = canvas.toDataURL('image/png');
      downloadBtn.download = currentFileName;
      resultArea.classList.remove('hidden');
      resultArea.classList.add('flex');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// GitHubへダイレクト公開処理
publishBtn.addEventListener('click', async () => {
  const token = localStorage.getItem('gh_token');
  const user = localStorage.getItem('gh_user');
  const repo = localStorage.getItem('gh_repo');

  if (!token) {
    alert('「GitHub連携設定」を開いて、Personal Access Token を入力・保存してください。');
    return;
  }

  publishBtn.disabled = true;
  publishBtn.classList.add('opacity-50');
  statusMsg.className = "text-xs font-bold text-center text-yellow-400";
  statusMsg.textContent = "🔄 GitHubへ送信中...";

  try {
    const base64Data = canvas.toDataURL('image/png').replace(/^data:image\/png;base64,/, "");
    const url = `https://api.github.com/repos/${user}/${repo}/contents/${currentFileName}`;
    
    // 既存ファイルのSHAを取得（上書き対応）
    let sha = null;
    const getRes = await fetch(url, {
      headers: { "Authorization": `token ${token}` }
    });
    if (getRes.ok) {
      const getData = await getRes.json();
      sha = getData.sha;
    }

    // アップロードリクエスト
    const putRes = await fetch(url, {
      method: "PUT",
      headers: {
        "Authorization": `token ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Auto publish banner: ${currentFileName}`,
        content: base64Data,
        sha: sha || undefined
      })
    });

    if (putRes.ok) {
      statusMsg.className = "text-xs font-bold text-center text-green-400";
      statusMsg.textContent = `✅ 公開成功！ 『${currentFileName}』 がLiminoidサイトにアップロードされました。`;
    } else {
      const errData = await putRes.json();
      throw new Error(errData.message || "送信エラー");
    }
  } catch (err) {
    statusMsg.className = "text-xs font-bold text-center text-red-400";
    statusMsg.textContent = `❌ エラー: ${err.message}`;
  } finally {
    publishBtn.disabled = false;
    publishBtn.classList.remove('opacity-50');
  }
});
</script>
</body>
</html>
